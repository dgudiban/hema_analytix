name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync repo to Hugging Face Space
        uses: huggingface/hub-sync@v1
        with:
          repo_id: Sravanireddyg/bloodiq
          repo_type: space
          branch: main
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
