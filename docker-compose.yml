# Postgres (with pgvector for the future RAG knowledge base).
# Start it with:  docker compose up -d
# Then run the app with:
#   DATABASE_URL=postgresql://labiq:labiq@localhost:5432/labiq uvicorn app.main:app --reload
# (from inside backend/). Without DATABASE_URL the app uses SQLite instead.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: labiq
      POSTGRES_USER: labiq
      POSTGRES_PASSWORD: <redacted>
    ports:
      - "5432:5432"
    volumes:
      - labiq_pgdata:/var/lib/postgresql/data

volumes:
  labiq_pgdata:
